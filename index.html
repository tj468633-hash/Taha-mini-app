function $(id){

  return document.getElementById(id);

}


function money(value){

  return Number(value || 0)
    .toLocaleString("fa-IR") + " تومان";

}


function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function toast(message){

  const el = $("toast");

  if(!el) return;

  el.textContent = message;

  el.classList.add("show");

  clearTimeout(window.__toastTimer);

  window.__toastTimer =
    setTimeout(() => {

      el.classList.remove("show");

    },2200);

}


/* =========================
   آدرس عکس
========================= */

function getImageUrl(product){

  const image =
    product?.image_url ||
    product?.image ||
    "";

  if(!image){

    return "";

  }

  if(
    image.startsWith("http://") ||
    image.startsWith("https://") ||
    image.startsWith("data:")
  ){

    return image;

  }

  return (
    "https://tj468633-hash.github.io/Taha-mini-app/" +
    image.replace(/^\/+/,"")
  );

}

    price:
      Number(item.price || 0),

    stock:

    image_url:

/* =========================
   بارگذاری محصولات از Supabase
========================= */

async function loadProducts(){

  console.log(
    "VELORA: loading products..."
  );


  /* اول نسخه محلی را نمایش بده */

  products = [
    ...DEFAULT_PRODUCTS
  ];


  renderCategories();

  renderProducts();

  renderCart();

  updateBadges();


  if(!db){

    if($("status")){

      $("status").textContent =
        "فروشگاه آماده است";

    }

    return;

  }


  try{

    const response =
      await db
        .from("products")
        .select("*")
        .order(
          "created_at",
          {
            ascending:true
          }
        );


    if(response.error){

      console.error(
        "Supabase products error:",
        response.error
      );


      if($("status")){

        $("status").textContent =
          "فروشگاه آماده است";

      }

      return;

    }


    if(
      Array.isArray(response.data) &&
      response.data.length > 0
    ){

      products =
        response.data.map(
          normalizeProduct
        );


      if($("status")){

        $("status").textContent =
          products.length +
          " محصول";

      }

    }else{

      products = [
        ...DEFAULT_PRODUCTS
      ];


      if($("status")){

        $("status").textContent =
          "فروشگاه آماده است";

      }

    }

  }catch(error){

    console.error(
      "VELORA Supabase error:",
      error
    );


    products = [
      ...DEFAULT_PRODUCTS
    ];


    if($("status")){

      $("status").textContent =
        "فروشگاه آماده است";

    }

  }


  renderCategories();

  renderProducts();

  renderCart();

  updateBadges();

}

/* =========================
   فیلتر محصولات
========================= */

function applyFilters(){

  const q =
    searchText
      .trim()
      .toLowerCase();


  filteredProducts =
    products.filter(product => {

      const categoryMatch =
        currentCategory === "همه" ||
        product.category === currentCategory;


      const searchMatch =
        !q ||
        String(product.name)
          .toLowerCase()
          .includes(q) ||

        String(product.description)
          .toLowerCase()
          .includes(q) ||

        String(product.category)
          .toLowerCase()
          .includes(q) ||

        String(product.sub)
          .toLowerCase()
          .includes(q);


      return (
        categoryMatch &&
        searchMatch
      );

    });

}

/* =========================

function findProduct(id){

  return products.find(
    product =>
      String(product.id) === String(id)
  );

}


/* =========================
   سبد خرید
========================= */

function addToCart(id){

  const product =
    findProduct(id);

  if(!product){

    toast("محصول پیدا نشد");

    return;

  }


  if(product.stock <= 0){

    toast("این محصول موجود نیست");

    return;

  }


  const existing =
    cart.find(
      item =>
        String(item.id) ===
        String(id)
    );


  if(existing){

    if(existing.qty >= product.stock){

      toast("بیشتر از موجودی نمی‌توانید اضافه کنید");

      return;

    }

    existing.qty += 1;

  }else{

    cart.push({

      id:String(product.id),

      qty:1

    });

  }


  saveCart();

  renderCart();

  updateBadges();

  toast(
    "محصول به سبد خرید اضافه شد 🛍️"
  );

}


function removeFromCart(id){

  cart =
    cart.filter(
      item =>
        String(item.id) !==
        String(id)
    );


  saveCart();

  renderCart();

  updateBadges();

}


function changeQuantity(id, delta){

  const item =
    cart.find(
      x =>
        String(x.id) ===
        String(id)
    );


  if(!item) return;


  const product =
    findProduct(id);


  if(!product) return;


  item.qty += delta;


  if(item.qty <= 0){

    removeFromCart(id);

    return;

  }


  if(item.qty > product.stock){

    item.qty =
      product.stock;

    toast("بیشتر از موجودی نمی‌توانید انتخاب کنید");

  }


  saveCart();

  renderCart();

  updateBadges();

}


function getCartItems(){

  return cart
    .map(item => {

      const product =
        findProduct(item.id);

      if(!product){

        return null;

      }

      return {

        ...product,

        qty:Number(item.qty || 1)

      };

    })
    .filter(Boolean);

}


function cartTotal(){

  return getCartItems()
    .reduce(
      (sum,item) =>
        sum +
        (
          Number(item.price || 0) *
          Number(item.qty || 0)
        ),
      0
    );

}


function updateBadges(){

  const count =
    cart.reduce(
      (sum,item) =>
        sum +
        Number(item.qty || 0),
      0
    );


  if($("cartCount")){

    $("cartCount").textContent =
      count;

  }


  if($("favCount")){

    $("favCount").textContent =
      favorites.length;

  }

}

  const index =
    favorites.indexOf(id);


  if(index >= 0){

    favorites.splice(
      index,
      1
    );

    toast(
      "از علاقه‌مندی حذف شد"
    );

  }else{

    favorites.push(id);

    toast(
      "به علاقه‌مندی اضافه شد ❤️"

  saveFavorites();

  updateBadges();

    currentProduct &&
    String(currentProduct.id) === id

    openProduct(id);

/* =========================
   ذخیره سفارش در Supabase
========================= */

async function saveOrderToSupabase(order){

  if(!db){

    return {
      success:false,
      error:"Supabase unavailable"
    };

  }


  try{

    /*
      فعلاً تلاش می‌کنیم سفارش را
      در جدول orders ذخیره کنیم.

      اگر ساختار دقیق جدول با این
      فیلدها متفاوت باشد، سفارش محلی
      همچنان ذخیره خواهد شد.
    */

    const payload = {

      customer_name:
        order.name,

      customer_phone:
        order.phone,

      province:
        order.province,

      city:
        order.city,

      address:
        order.address,

      postal_code:
        order.postal,

      note:
        order.note,

      total:
        order.total

    };


    const result =
      await db
        .from("orders")
        .insert(payload)
        .select()
        .single();


    if(result.error){

      console.error(
        "Order Supabase error:",
        result.error
      );


      return {
        success:false,
        error:result.error
      };

    }


    return {
      success:true,
      data:result.data
    };


  }catch(error){

    console.error(
      "Order save error:",
      error
    );


    return {
      success:false,
      error
    };

  }

}


/* =========================

========================= */

async function submitOrder(event){

  event.preventDefault();


  const items =
    getCartItems();


  if(items.length === 0){

    toast(
      "سبد خرید خالی است"
    );

    return;

  }


  const name =
    $("checkoutName")?.value.trim();


  const phone =
    $("checkoutPhone")?.value.trim();


  const province =
    $("checkoutProvince")?.value;


  const city =
    $("checkoutCity")?.value.trim();


  const address =
    $("checkoutAddress")?.value.trim();


  const postal =
    $("checkoutPostal")?.value.trim();


  const note =
    $("checkoutNote")?.value.trim();


  if(
    !name ||
    !phone ||
    !province ||
    !city ||
    !address
  ){

    toast(
      "لطفاً اطلاعات ضروری سفارش را کامل کنید"
    );

    return;

  }


  const order = {

    id:
      "V" +
      Date.now(),

    name,

    phone,

    province,

    city,

    address,

    postal,

    note,

    items:

      items.map(item => ({

        id:item.id,

        name:item.name,

        price:item.price,

        qty:item.qty

      })),

    total:
      cartTotal(),

    createdAt:
      new Date().toISOString()

  };


  const button =
    event.target.querySelector(
      'button[type="submit"]'
    );


  if(button){

    button.disabled = true;

    button.textContent =
      "در حال ثبت سفارش...";

  }


  /*
    ابتدا محلی ذخیره می‌کنیم
    تا سفارش مشتری از بین نرود.
  */

  orders.unshift(order);

  saveOrders();


  /*
    ذخیره در Supabase
  */

  const remote =
    await saveOrderToSupabase(
      order
    );


  /*
    پاک کردن سبد
  */

  cart = [];

  saveCart();

  renderCart();

  updateBadges();


  if(button){

    button.disabled = false;

    button.textContent =
      "ثبت سفارش";

  }


  closePanel(
    "accountOverlay"
  );


  if(remote.success){

    toast(
      "سفارش با موفقیت ثبت شد 🌸"
    );

  }else{

    toast(
      "سفارش ثبت شد 🌸"
    );

  }


  /*
    ارسال پیام به تلگرام
    فعلاً از طریق لینک باز می‌شود.
    برای ارسال خودکار واقعی باید
    Telegram Bot + Edge Function
    اضافه شود.
  */

}

  /* =========================

========================= */

document.addEventListener(
  "click",
  function(event){

    const target =
      event.target;


    /* -------------------------
       دسته‌بندی
    ------------------------- */

    const categoryButton =
      target.closest(
        "[data-category]"
      );


    if(categoryButton){

      currentCategory =
        categoryButton
          .getAttribute(
            "data-category"
          );


      renderCategories();

      renderProducts();

      return;

    }


    /* -------------------------
       افزودن به سبد
    ------------------------- */

    const addButton =
      target.closest(
        "[data-add-cart]"
      );


    if(addButton){

      addToCart(
        addButton.getAttribute(
          "data-add-cart"
        )
      );

      return;

    }


    /* -------------------------
       علاقه‌مندی
    ------------------------- */

    const favoriteButton =
      target.closest(
        "[data-favorite]"
      );


    if(favoriteButton){

      toggleFavorite(
        favoriteButton.getAttribute(
          "data-favorite"
        )
      );

      return;

    }


    /* -------------------------
       افزایش تعداد
    ------------------------- */

    const plusButton =
      target.closest(
        "[data-qty-plus]"
      );


    if(plusButton){

      changeQuantity(
        plusButton.getAttribute(
          "data-qty-plus"
        ),
        1
      );

      return;

    }


    /* -------------------------
       کاهش تعداد
    ------------------------- */

    const minusButton =
      target.closest(
        "[data-qty-minus]"
      );


    if(minusButton){

      changeQuantity(
        minusButton.getAttribute(
          "data-qty-minus"
        ),
        -1
      );

      return;

    }


    /* -------------------------
       حذف از سبد
    ------------------------- */

    const removeButton =
      target.closest(
        "[data-remove-cart]"
      );


    if(removeButton){

      removeFromCart(
        removeButton.getAttribute(
          "data-remove-cart"
        )
      );

      return;

    }


    /* -------------------------
       باز کردن محصول
    ------------------------- */

    const productCard =
      target.closest(
        ".product-card"
      );


    if(
      productCard &&
      !target.closest(
        "button"
      )
    ){

      openProduct(
        productCard.getAttribute(
          "data-product-id"
        )
      );

      return;

    }


    /* -------------------------
       علاقه‌مندی‌های حساب
    ------------------------- */

    if(
      target.id ===
      "showFavoritesFromAccount" ||

      target.id ===
      "accountFavoritesBtn"
    ){

      showFavorites();

      return;

    }


    /* -------------------------
       خروج
    ------------------------- */

    if(
      target.id ===
      "logoutBtn"
    ){

      user = null;

      saveUser();

      toast(
        "از حساب خارج شدید"
      );

      renderAccount();

      return;

    }


    /* -------------------------
       ثبت سفارش
    ------------------------- */

    if(
      target.id ===
      "checkoutBtn"
    ){

      openCheckout();

      return;

    }


    /* -------------------------
       افزودن از جزئیات محصول
    ------------------------- */

    if(
      target.id ===
      "detailAddCart"
    ){

      if(currentProduct){

        addToCart(
          currentProduct.id
        );

      }

      return;

    }


    /* -------------------------
       علاقه‌مندی از جزئیات
    ------------------------- */

    if(
      target.id ===
      "detailFavorite"
    ){

      if(currentProduct){

        toggleFavorite(
          currentProduct.id
        );

      }

      return;

    }

  }
);
