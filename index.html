<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#fff7fa">

<title>VELORA STORE</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Vazirmatn,Arial,sans-serif;
    background:#fffafb;
    color:#302329;
}

button,
input,
textarea,
select{
    font-family:inherit;
}

button{
    cursor:pointer;
}

.header{
    position:sticky;
    top:0;
    z-index:100;
    background:rgba(255,250,252,.95);
    backdrop-filter:blur(15px);
    border-bottom:1px solid #f2dfe6;
}

.nav{
    max-width:1100px;
    margin:auto;
    padding:13px 18px;
    display:flex;
    align-items:center;
    gap:10px;
}

.logo{
    margin-left:auto;
    font-size:22px;
    font-weight:800;
    color:#b93f6b;
}

.logo span{
    display:block;
    font-size:9px;
    letter-spacing:2px;
    color:#927b84;
    font-weight:500;
}

.icon-button{
    width:44px;
    height:44px;
    border-radius:14px;
    border:1px solid #efdbe3;
    background:#fff;
    font-size:20px;
    position:relative;
}

.badge{
    position:absolute;
    top:-5px;
    left:-5px;
    min-width:20px;
    height:20px;
    padding:0 5px;
    background:#c74272;
    color:white;
    border-radius:20px;
    font-size:11px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:2px solid white;
}

/* SEARCH */

.search-area{
    max-width:1100px;
    margin:15px auto;
    padding:0 18px;
}

.search-box{
    display:flex;
    align-items:center;
    gap:8px;
    background:#fff;
    border:1px solid #eedde3;
    border-radius:16px;
    padding:0 14px;
}

.search-box input{
    width:100%;
    border:none;
    outline:none;
    padding:13px 5px;
    background:transparent;
}

/* HERO */

.hero{
    max-width:1100px;
    margin:20px auto;
    padding:0 18px;
}

.hero-box{
    background:linear-gradient(135deg,#fff0f5,#fff);
    border:1px solid #f0d9e2;
    border-radius:28px;
    padding:30px;
    display:flex;
    align-items:center;
    gap:25px;
}

.hero-text{
    flex:1;
}

.hero-text h1{
    margin:0 0 10px;
    font-size:30px;
}

.hero-text p{
    color:#806c74;
    line-height:2;
    margin:0 0 18px;
}

.hero-icon{
    font-size:90px;
}

.primary-button{
    border:none;
    background:#c74372;
    color:#fff;
    border-radius:14px;
    padding:12px 20px;
    font-weight:700;
    box-shadow:0 8px 20px #c7437225;
}

/* SECTIONS */

.section{
    max-width:1100px;
    margin:30px auto;
    padding:0 18px;
}

.section-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:15px;
}

.section-header h2{
    margin:0;
    font-size:21px;
}

.muted{
    color:#8c7880;
    font-size:13px;
}

/* CATEGORY */

.categories{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

.category{
    border:1px solid #efdde4;
    background:#fff;
    border-radius:18px;
    padding:15px 8px;
    text-align:center;
}

.category:hover{
    border-color:#e6b6c8;
}

.category-icon{
    font-size:30px;
    margin-bottom:5px;
}

.category-name{
    font-size:13px;
    font-weight:700;
}

/* PRODUCTS */

.products{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.product-card{
    position:relative;
    background:#fff;
    border:1px solid #f0dfe5;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 8px 25px #57263c08;
}

.product-image{
    width:100%;
    height:220px;
    background:#fff2f6;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.product-image img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.product-placeholder{
    font-size:65px;
}

.favorite-button{
    position:absolute;
    top:10px;
    left:10px;
    z-index:5;
    width:40px;
    height:40px;
    border-radius:50%;
    border:1px solid #ead7df;
    background:#ffffffec;
    font-size:22px;
}

.favorite-button.active{
    color:#d63e70;
    background:#fff0f5;
}

.product-info{
    padding:14px;
}

.product-info h3{
    margin:0 0 7px;
    font-size:15px;
}

.product-description{
    min-height:42px;
    color:#8a757e;
    font-size:12px;
    line-height:1.8;
}

.price{
    color:#b83d69;
    font-size:16px;
    font-weight:800;
    margin:8px 0;
}

.stock{
    color:#8b757e;
    font-size:11px;
    margin-bottom:10px;
}

.product-actions{
    display:flex;
    gap:7px;
}

.add-cart{
    flex:1;
    border:1px solid #efcbd8;
    background:#fff0f5;
    color:#b83d69;
    border-radius:11px;
    padding:9px;
    font-weight:700;
}

.detail-button{
    width:43px;
    border:1px solid #eadde2;
    background:#fff;
    border-radius:11px;
}

/* CART */

.overlay{
    position:fixed;
    inset:0;
    background:#0006;
    z-index:200;
    display:none;
}

.overlay.show{
    display:block;
}

.cart-panel{
    position:absolute;
    top:0;
    right:0;
    width:min(440px,94vw);
    height:100%;
    background:white;
    padding:20px;
    overflow:auto;
}

.panel-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:15px;
}

.close-button{
    width:40px;
    height:40px;
    border:none;
    border-radius:12px;
    background:#fff0f5;
    color:#a83a63;
    font-size:18px;
}

.cart-item{
    display:flex;
    gap:10px;
    padding:13px 0;
    border-bottom:1px solid #f1e5e9;
}

.cart-image{
    width:70px;
    height:70px;
    border-radius:13px;
    object-fit:cover;
    background:#fff0f5;
}

.cart-info{
    flex:1;
}

.cart-info strong{
    font-size:13px;
}

.quantity{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:8px;
}

.quantity button{
    width:29px;
    height:29px;
    border:none;
    border-radius:8px;
    background:#f8edf1;
}

.remove-button{
    border:none;
    background:none;
    color:#c43c6c;
    font-size:12px;
}

.total-box{
    margin-top:18px;
    background:#fff7fa;
    border:1px solid #f0dce4;
    border-radius:17px;
    padding:15px;
}

.total-row{
    display:flex;
    justify-content:space-between;
    margin:9px 0;
}

.total-final{
    font-size:18px;
    font-weight:800;
    color:#b83d69;
}

/* PRODUCT DETAIL */

.modal{
    position:fixed;
    inset:0;
    z-index:300;
    background:#0006;
    display:none;
    align-items:center;
    justify-content:center;
    padding:15px;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(520px,100%);
    max-height:90vh;
    overflow:auto;
    background:#fff;
    border-radius:24px;
    padding:20px;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.detail-image{
    width:100%;
    max-height:380px;
    object-fit:cover;
    border-radius:18px;
    margin:12px 0;
}

/* CHECKOUT */

.checkout{
    position:fixed;
    inset:0;
    z-index:250;
    background:#fff;
    overflow:auto;
    display:none;
}

.checkout.show{
    display:block;
}

.checkout-container{
    max-width:750px;
    margin:auto;
    padding:20px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:15px;
}

.field{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.field.full{
    grid-column:1/-1;
}

.field label{
    font-size:12px;
    color:#715d65;
}

.field input,
.field textarea{
    border:1px solid #eadce2;
    border-radius:12px;
    padding:12px;
    outline:none;
}

.field textarea{
    min-height:100px;
    resize:vertical;
}

/* TOAST */

.toast{
    position:fixed;
    bottom:25px;
    left:50%;
    transform:translateX(-50%) translateY(30px);
    background:#30252a;
    color:#fff;
    padding:11px 18px;
    border-radius:13px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:500;
    font-size:13px;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

/* EMPTY */

.empty{
    grid-column:1/-1;
    text-align:center;
    padding:40px;
    color:#927e86;
}

/* MOBILE */

.bottom-nav{
    display:none;
}

@media(max-width:850px){

    .products{
        grid-template-columns:repeat(2,1fr);
    }

    .hero-box{
        padding:22px;
    }

}

@media(max-width:550px){

    .logo{
        font-size:19px;
    }

    .hero-box{
        padding:18px;
    }

    .hero-text h1{
        font-size:23px;
    }

    .hero-icon{
        font-size:55px;
    }

    .categories{
        grid-template-columns:repeat(2,1fr);
    }

    .products{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
    }

    .product-image{
        height:180px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .field.full{
        grid-column:auto;
    }

    .bottom-nav{
        position:fixed;
        bottom:0;
        left:0;
        right:0;
        height:63px;
        background:#fff;
        border-top:1px solid #efdee4;
        z-index:150;
        display:flex;
        justify-content:space-around;
        align-items:center;
    }

    .bottom-nav button{
        border:none;
        background:none;
        color:#77636c;
        font-size:10px;
    }

    .bottom-nav span{
        display:block;
        font-size:20px;
        margin-bottom:2px;
    }

    body{
        padding-bottom:65px;
    }

}

</style>
</head>

);

function updateCartBadge(){

const count =
cart.reduce(
(total,item)=>total + item.quantity,
0
);

document.getElementById("cartBadge")
.textContent=count;

}
