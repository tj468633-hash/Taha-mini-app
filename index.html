<style>
:root{--p:#e96b9a;--bg:#fff9fb;--soft:#fff0f6;--dark:#30232a;--muted:#806b74;--line:#f1dce5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--dark);font-family:Tahoma,Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}
.wrap{max-width:1100px;margin:auto;padding:0 16px}
header{position:sticky;top:0;z-index:20;background:#fffc;border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}
.nav{height:68px;display:flex;align-items:center;gap:9px}
.logo{margin-left:auto;color:var(--p);font-size:21px;font-weight:900}
.navbtn{width:44px;height:44px;border-radius:14px;background:var(--soft);color:var(--p);font-size:19px;position:relative}
.badge{position:absolute;top:-3px;left:-3px;background:var(--dark);color:#fff;border-radius:99px;font-size:10px;min-width:18px;height:18px;padding:2px}
.search{display:flex;align-items:center;gap:8px;margin:14px 0}
.search input{flex:1;border:1px solid var(--line);border-radius:16px;padding:13px 16px;background:white;outline:none}
.hero{margin:10px 0 18px;padding:28px 22px;border-radius:26px;background:linear-gradient(135deg,#ffe4ef,#fff);box-shadow:0 10px 30px #7c3a5515}
.hero h1{margin:0 0 8px;font-size:29px}
.hero p{margin:0;color:var(--muted);line-height:1.9}
.cats{display:flex;gap:8px;overflow:auto;padding-bottom:8px}
.cat{white-space:nowrap;background:white;border:1px solid var(--line);padding:9px 15px;border-radius:99px;color:var(--muted)}
.cat.active{background:var(--p);color:#fff;border-color:var(--p)}
.sectiontitle{display:flex;align-items:center;justify-content:space-between;margin:18px 0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding-bottom:40px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 6px 20px #7c3a5510}
.pic{height:190px;background:linear-gradient(135deg,#fff0f6,#fff);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:cover}
.ph{font-size:52px}
.fav{position:absolute;top:9px;left:9px;background:#fff;box-shadow:0 3px 12px #0001;border-radius:50%;width:38px;height:38px;color:#bbb;font-size:19px}
.fav.on{color:#e94d88}
.info{padding:13px}
.name{font-weight:800;min-height:42px;line-height:1.6}
.desc{font-size:12px;color:var(--muted);line-height:1.7;height:40px;overflow:hidden}
.price{font-weight:900;color:var(--p);margin:8px 0}
.stock{font-size:11px;color:#68846e}
.add{width:100%;background:var(--dark);color:#fff;padding:11px;border-radius:13px;margin-top:9px}
.add:disabled{opacity:.4}
.overlay{position:fixed;inset:0;background:#0006;z-index:50;display:none}
.overlay.show{display:block}
.panel{position:absolute;right:0;top:0;height:100%;width:min(430px,94vw);background:#fff;padding:18px;overflow:auto;box-shadow:-10px 0 40px #0002}
.modal{position:absolute;inset:5%;max-width:650px;margin:auto;background:#fff;border-radius:25px;overflow:auto;padding:20px;height:max-content;max-height:90vh}
.close{float:left;background:#f7e8ee;border-radius:12px;width:38px;height:38px}
.cartrow{display:grid;grid-template-columns:70px 1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.thumb{width:70px;height:70px;border-radius:14px;object-fit:cover}
.qty{display:flex;align-items:center;gap:7px;margin-top:7px}
.qty button{width:30px;height:30px;border-radius:9px;background:#f9e6ee}
.total{display:flex;justify-content:space-between;font-weight:900;font-size:18px;padding:18px 0}
.primary{background:var(--p);color:#fff;border-radius:14px;padding:13px;width:100%}
.secondary{background:#f8eaf0;color:var(--dark);border-radius:14px;padding:11px;width:100%;margin-top:8px}
.form{display:grid;gap:10px}
.form input,.form textarea,.form select{width:100%;padding:12px;border:1px solid var(--line);border-radius:13px;outline:none;background:#fff}
.empty{text-align:center;padding:50px 10px;color:var(--muted)}
.muted{color:var(--muted);font-size:13px;line-height:1.8}
.loading{text-align:center;padding:40px;color:var(--muted)}
.order{border:1px solid var(--line);border-radius:16px;padding:12px;margin:10px 0;background:#fff}
.toast{position:fixed;bottom:22px;right:50%;transform:translateX(50%) translateY(30px);background:var(--dark);color:#fff;padding:12px 18px;border-radius:99px;z-index:100;opacity:0;transition:.25s}
.toast.show{opacity:1;transform:translateX(50%) translateY(0)}
hr{border:0;border-top:1px solid var(--line);margin:20px 0}
@media(max-width:800px){
.grid{grid-template-columns:repeat(2,1fr)}
.pic{height:165px}
.hero h1{font-size:25px}
}
@media(max-width:420px){
.grid{gap:9px}
.card{border-radius:16px}
.pic{height:145px}
.info{padding:10px}
.name{font-size:13px}
.price{font-size:13px}
}
</style>
</head>

function addToCart(id){

const product=findProduct(id);

if(!product)return;

const existing=
cart.find(item=>String(item.id)===String(id));

if(existing){

if(existing.qty>=product.stock){

toast("بیشتر از موجودی نمی‌توانی اضافه کنی");

return;

}

existing.qty++;

}else{

cart.push({
id:product.id,
qty:1
});

}

saveAll();

toast("محصول به سبد اضافه شد 🌸");

renderCart();

}

function changeQuantity(id,direction){

const item=
cart.find(x=>String(x.id)===String(id));

const product=findProduct(id);

if(!item||!product)return;

item.qty+=direction;

if(item.qty<=0){

cart=
cart.filter(
x=>String(x.id)!==String(id)
);

}

item.qty=product.stock;

}

saveAll();

renderCart();

}

async function saveOrderToSupabase(order){

try{

if(!db)return false;

const {
data:{user:supabaseUser}
}=await db.auth.getUser();

if(!supabaseUser)return false;

const {
data:createdOrder,
error
}=await db
.from("orders")
.insert({

user_id:supabaseUser.id,
total_amount:order.total,
status:"pending"

})
.select()
.single();

if(error)throw error;

const items=
order.items.map(item=>({

order_id:createdOrder.id,
product_id:item.id,
quantity:item.qty,
unit_price:item.price

}));

const {
error:itemError
}=await db
.from("order_items")
.insert(items);

if(itemError)throw itemError;

return true;

}catch(error){

console.warn(
"Supabase order error:",
error
);

return false;

}

}

async function loadProducts(){

try{

if(!db)
throw new Error("Supabase unavailable");

const {
data,
error
}=await db
.from("products")
.select("*")
.eq("is_active",true)
.order(
"created_at",
{ascending:true}
);

if(error)
throw error;

if(data&&data.length){

products=data;

$("status").textContent=
"اتصال به فروشگاه برقرار است";

}else{

products=[...DEFAULT_PRODUCTS];

$("status").textContent=
"فروشگاه آماده است";

}

}catch(error){

console.warn(
"Supabase product error:",
error
);

products=[...DEFAULT_PRODUCTS];

$("status").textContent=
"حالت فروشگاه";

}

renderCategories();

renderProducts();

renderCart();

updateBadges();

}
