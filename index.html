:root{
--p:#e96b9a;
--p2:#d94d82;
--bg:#fff9fb;
--soft:#fff0f6;
--dark:#30232a;
--muted:#806b74;
--line:#f1dce5;
}
*{box-sizing:border-box}
body{
margin:0;
background:var(--bg);
color:var(--dark);
font-family:Tahoma,Arial,sans-serif;
min-height:100vh;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}
.wrap{max-width:1100px;margin:auto;padding:0 16px}

header{
position:sticky;
top:0;
z-index:30;
background:#fffc;
border-bottom:1px solid var(--line);
backdrop-filter:blur(12px);
}

.nav{
height:68px;
display:flex;
align-items:center;
gap:9px;
}

.logo{
margin-left:auto;
color:var(--p);
font-size:21px;
font-weight:900;
}

.navbtn{
width:44px;
height:44px;
border-radius:14px;
background:var(--soft);
color:var(--p);
font-size:19px;
position:relative;
}

.badge{
position:absolute;
top:-4px;
left:-4px;
background:var(--dark);
color:white;
border-radius:99px;
font-size:10px;
min-width:18px;
height:18px;
padding:2px 5px;
display:flex;
align-items:center;
justify-content:center;
}

.search{
display:flex;
align-items:center;
gap:8px;
margin:15px 0;
}

.searchbox{
position:relative;
flex:1;
}

.searchbox input{
width:100%;
border:1px solid var(--line);
border-radius:17px;
padding:14px 44px 14px 16px;
background:white;
outline:none;
}

.searchicon{
position:absolute;
right:14px;
top:50%;
transform:translateY(-50%);
}

.hero{
margin:10px 0 20px;
padding:30px 24px;
border-radius:28px;
background:linear-gradient(135deg,#ffe4ef,#fff);
box-shadow:0 10px 30px #7c3a5515;
}

.hero h1{
margin:0 0 9px;
font-size:30px;
}

.hero p{
margin:0;
color:var(--muted);
line-height:2;
}

.hero-buttons{
display:flex;
gap:9px;
margin-top:18px;
flex-wrap:wrap;
}

.hero-btn{
padding:11px 17px;
border-radius:14px;
background:var(--dark);
color:white;
}

.hero-btn.light{
background:white;
color:var(--p);
border:1px solid var(--line);
}

.cats{
display:flex;
gap:8px;
overflow:auto;
padding-bottom:10px;
}

.cat{
white-space:nowrap;
background:white;
border:1px solid var(--line);
padding:9px 15px;
border-radius:99px;
color:var(--muted);
}

.cat.active{
background:var(--p);
color:white;
border-color:var(--p);
}

.sectiontitle{
display:flex;
align-items:center;
justify-content:space-between;
margin:18px 0;
}

.sectiontitle h2{
margin:0;
font-size:21px;
}

.muted{
color:var(--muted);
font-size:13px;
line-height:1.9;
}

.grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:14px;
padding-bottom:35px;
}

.card{
background:white;
border:1px solid var(--line);
border-radius:21px;
overflow:hidden;
box-shadow:0 10px 30px #7c3a5510;
}

.pic{
height:190px;
background:linear-gradient(135deg,#fff0f6,#fff);
display:flex;
align-items:center;
justify-content:center;
position:relative;
overflow:hidden;
}

.pic img{
width:100%;
height:100%;
object-fit:cover;
}

.ph{
font-size:55px;
}

.fav{
position:absolute;
top:9px;
left:9px;
background:white;
box-shadow:0 3px 12px #0001;
border-radius:50%;
width:39px;
height:39px;
color:#bbb;
font-size:20px;
z-index:2;
}

.fav.on{
color:#e94d88;
}

.info{
padding:13px;
}

.name{
font-weight:800;
min-height:43px;
line-height:1.65;
}

.desc{
font-size:12px;
color:var(--muted);
line-height:1.7;
height:41px;
overflow:hidden;
}

.price{
font-weight:900;
color:var(--p);

}

.stock{
font-size:11px;
color:#5f8b69;
}

.stock.out{
color:#b26a78;
}

.add{
width:100%;
background:var(--dark);
color:white;
padding:11px;
border-radius:13px;
margin-top:9px;
}

.loading,.empty{
text-align:center;
padding:50px 10px;
color:var(--muted);
grid-column:1/-1;
}

.overlay{
position:fixed;
inset:0;
background:#0008;
z-index:100;
display:none;
}

.overlay.show{
display:block;
}

.panel{
position:absolute;
right:0;
top:0;
height:100%;
width:min(460px,95vw);
background:white;
padding:18px;
overflow:auto;
box-shadow:-10px 0 40px #0002;
}

.modal{
position:absolute;
inset:4%;
max-width:680px;
margin:auto;
background:white;
border-radius:26px;
overflow:auto;
padding:20px;
height:max-content;
max-height:92vh;
}

.close{
float:left;
background:#f7e8ee;
border-radius:12px;
width:38px;
height:38px;
}

.primary{
background:var(--p);
color:white;
border-radius:14px;
padding:13px;
width:100%;
}

.secondary{
background:#f8eaf0;
color:var(--dark);
border-radius:14px;
padding:11px;
width:100%;
margin-top:8px;
}

.form{
display:grid;
gap:10px;
}

.form input,
.form textarea,
.form select{
width:100%;
padding:12px;
border:1px solid var(--line);
border-radius:13px;
outline:none;
background:white;
}

.cartrow{
display:grid;
grid-template-columns:70px 1fr auto;
gap:10px;
align-items:center;
padding:12px 0;
border-bottom:1px solid var(--line);
}

.qty{
display:flex;
align-items:center;
gap:7px;
margin-top:8px;
}

.qty button{
width:30px;
height:30px;
border-radius:9px;
background:#f9e6ee;
}

.total{
display:flex;
justify-content:space-between;
font-weight:900;
font-size:18px;
padding:18px 0;
}

.order{
border:1px solid var(--line);
border-radius:16px;
padding:13px;
margin:10px 0;
}

.review{
background:white;
border:1px solid var(--line);
border-radius:16px;
padding:13px;
margin:9px 0;
}

.stars{
color:#f2ad35;

.toast{
position:fixed;
bottom:22px;
right:50%;
transform:translateX(50%) translateY(30px);
background:var(--dark);
color:white;
padding:12px 18px;
border-radius:99px;
z-index:300;
opacity:0;
transition:.25s;
}

.toast.show{
opacity:1;
transform:translateX(50%) translateY(0);
}

footer{
margin-top:25px;
background:white;
border-top:1px solid var(--line);
padding:30px 0;
}

.footer-grid{
display:grid;
grid-template-columns:2fr 1fr 1fr;
gap:20px;

.footer-title{
font-weight:900;
color:var(--p);
margin-bottom:9px;

.footer-link{
display:block;
background:none;
color:var(--muted);
padding:5px 0;

@media(max-width:900px){
.grid{grid-template-columns:repeat(3,1fr)}
.footer-grid{grid-template-columns:1fr 1fr}

@media(max-width:650px){
.grid{grid-template-columns:repeat(2,1fr)}
.pic{height:165px}

@media(max-width:420px){

.pic{height:145px}
.info{padding:10px}
.name{font-size:13px}
.price{font-size:13px}
.desc{font-size:11px}

return value
?JSON.parse(value)
:fallback;

}catch(e){

}

}

function findProduct(id){

return products.find(
p=>String(p.id)===String(id)
);

}

function imageURL(product){

if(!product.image_url){

return "";

}

const url=
String(product.image_url);

if(
url.startsWith("http")
){

return url;

}

return
"https://tj468633-hash.github.io/Taha-mini-app/"
+
url.replace(/^\.?\//,"");

}

function imageHTML(product){

const url=imageURL(product);

if(!url){

return "";

}

return `
<img
src="${url}"
alt="${product.name}"
onerror="
this.style.display='none';
this.parentElement.querySelector('.ph').style.display='block';
">
`;

}

function filteredProducts(){

const q=
query.trim().toLowerCase();

return products.filter(product=>{

const catOK=
category==="همه"||
product.category===category||
product.sub===category;

const text=
(
product.name+
" "+
(product.description||"")+
" "+
(product.category||"")+
" "+
(product.sub||"")
).toLowerCase();

return catOK &&
(!q||text.includes(q));

});

}

function addToCart(id){

const product=
findProduct(id);

if(!product){

toast("محصول پیدا نشد");

return;

}

const stock=
Number(product.stock||0);

if(stock<=0){

toast("این محصول ناموجود است");

return;

}

const existing=
cart.find(
item=>String(item.id)===String(id)
);

if(existing){

if(existing.qty>=stock){

toast(
"بیشتر از موجودی نمی‌توانی اضافه کنی"
);

return;

}

existing.qty++;

}else{

cart.push({
id:product.id,
qty:1
});

}

saveAll();

renderCart();

toast(
"محصول به سبد اضافه شد 🌸"
);

}

item.qty+=direction;

function cartTotal(){

return cart.reduce(
(sum,item)=>{

const product=
findProduct(item.id);

if(!product){

return sum;

}

return sum+
Number(product.price||0)*
Number(item.qty||0);

},
0
);

}

async function saveOrderToSupabase(order){

try{

if(!db){

return false;

}

const result=
await db.auth.getUser();

const supabaseUser=
result?.data?.user;

if(!supabaseUser){

return false;

}

const response=
await db
.from("orders")
.insert({

user_id:supabaseUser.id,
total_amount:order.total,
status:"pending"

})
.select()
.single();

if(response.error){

console.log(
"Order error:",
response.error
);

return false;

}

const createdOrder=
response.data;

const items=
order.items.map(item=>({

order_id:createdOrder.id,
product_id:item.id,
quantity:item.qty,
unit_price:item.price

}));

if(items.length){

const itemResponse=
await db
.from("order_items")
.insert(items);

if(itemResponse.error){

console.log(
"Items error:",
itemResponse.error
);

}

}

return true;

}catch(error){

console.log(error);

return false;

}

}

async function confirmOrder(){

const name=
$("customerName")?.value.trim();

const phone=
$("customerPhone")?.value.trim();

const province=
$("province")?.value;

const city=
$("city")?.value.trim();

const address=
$("address")?.value.trim();

const postal=
$("postal")?.value.trim();

const note=
$("note")?.value.trim();

if(
!name||
!phone||
!province||
!city||
!address||
!postal
){

toast(
"لطفاً اطلاعات ضروری را کامل کن"
);

return;

}

const items=[];

for(
const item of cart
){

const product=
findProduct(item.id);

if(!product){

continue;

}

if(
Number(item.qty)>
Number(product.stock)
){

toast(
"موجودی محصول کافی نیست"
);

return;

}

items.push({

id:product.id,
qty:Number(item.qty),
price:Number(product.price)

});

}

if(!items.length){

toast(
"سبد خرید خالی است"
);

return;

}

const total=
items.reduce(
(sum,item)=>
sum+
item.price*item.qty,
0
);

const order={

code:
"VLR-"+
Date.now()
.toString()
.slice(-8),

date:
new Date()
.toISOString(),

name:name,
phone:phone,
province:province,
city:city,
address:address,
postal:postal,
note:note,
total:total,
status:"در انتظار بررسی",
items:items

};

orders.push(order);

user={
name:name,
phone:phone
};

cart=[];

saveAll();

renderCart();

renderProducts();

renderAccount();

await saveOrderToSupabase(
order
);

toast(
"سفارش با موفقیت ثبت شد 🌸"
);

setTimeout(
()=>{
closePanel("drawer");
},
800
);

}
