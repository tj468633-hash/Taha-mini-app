<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#ff5c9d">
<title>VELORA STORE</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}

body{
  margin:0;
  font-family:Tahoma,Arial,sans-serif;
  background:#fff8fb;
  color:#342530;
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

:root{
  --pink:#ff5b9d;
  --pink2:#ff8cbc;
  --light:#fff0f6;
  --border:#f0dce6;
  --text:#342530;
  --muted:#8b7882;
  --white:#fff;
  --shadow:0 10px 35px rgba(190,70,120,.10);
}

.header{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(14px);
  border-bottom:1px solid #f4e3ea;
}

.header-inner{
  max-width:1150px;
  margin:auto;
  padding:13px 16px;
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  color:var(--pink);
  font-weight:900;
  font-size:23px;
  white-space:nowrap;
}

.logo small{
  display:block;
  color:#a38d97;
  font-size:9px;
  letter-spacing:2px;
  margin-top:2px;
}

.search{
  flex:1;
  position:relative;
}

.search input{
  width:100%;
  border:1px solid var(--border);
  background:#fffafd;
  border-radius:14px;
  padding:12px 15px;
  outline:none;
}

.search input:focus{
  border-color:var(--pink2);
  box-shadow:0 0 0 3px #ff5b9d18;
}

.header-actions{
  display:flex;
  gap:7px;
}

.icon-btn{
  border:0;
  background:var(--light);
  color:#c72d6b;
  width:43px;
  height:43px;
  border-radius:13px;
  position:relative;
}

.badge{
  position:absolute;
  top:-5px;
  left:-4px;
  min-width:19px;
  height:19px;
  padding:0 5px;
  border-radius:20px;
  background:#e83d7e;
  color:white;
  font-size:10px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.hero{
  max-width:1150px;
  margin:18px auto;
  padding:34px 25px;
  border-radius:28px;
  background:linear-gradient(135deg,#ffe5f0,#fff);
  box-shadow:var(--shadow);
  position:relative;
  overflow:hidden;
}

.hero:after{
  content:"";
  position:absolute;
  width:180px;
  height:180px;
  border-radius:50%;
  background:#ff8cbc33;
  left:-55px;
  bottom:-80px;
}

.hero h1{
  margin:0 0 10px;
  font-size:32px;
  color:#c92e6c;
}

.hero p{
  margin:0;
  color:#765f69;
  line-height:2;
  max-width:600px;
}

.hero-btn{
  margin-top:18px;
  border:0;
  background:var(--pink);
  color:white;
  padding:13px 22px;
  border-radius:14px;
  font-weight:bold;
}

.container{
  max-width:1150px;
  margin:auto;
  padding:0 16px 35px;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin:25px 0 14px;
}

.section-title h2{
  margin:0;
  font-size:20px;
}

.section-title span{
  color:var(--muted);
  font-size:12px;
}

.categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:4px;
}

.category{
  flex:0 0 auto;
  border:1px solid var(--border);
  background:white;
  color:#8c4e69;
  padding:10px 16px;
  border-radius:30px;
}

.category.active{
  background:var(--pink);
  color:white;
  border-color:var(--pink);
}

.products{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}

.product-card{
  background:white;
  border-radius:20px;
  overflow:hidden;
  box-shadow:var(--shadow);
  border:1px solid #f6e8ee;
  transition:.2s;
}

.product-card:hover{
  transform:translateY(-2px);
}

.product-image-wrap{
  aspect-ratio:1/1;
  background:#fff0f6;
  position:relative;
  overflow:hidden;
}

.product-image{
  width:100%;
  height:100%;
  object-fit:cover;
}

.favorite{
  position:absolute;
  top:9px;
  left:9px;
  width:38px;
  height:38px;
  border:0;
  border-radius:50%;
  background:#ffffffdd;
  color:#d64d80;
  font-size:18px;
}

.favorite.active{
  background:#ff5b9d;
  color:white;
}

.product-body{
  padding:13px;
}

.product-name{
  font-weight:bold;
  line-height:1.7;
  min-height:45px;
}

.product-desc{
  color:var(--muted);
  font-size:11px;
  line-height:1.8;
  height:40px;
  overflow:hidden;
}

.product-bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:7px;
  margin-top:10px;
}

.price{
  color:#d42d6e;
  font-weight:900;
  font-size:14px;
}

.stock{
  color:#8b7882;
  font-size:10px;
}

.add-btn{
  width:100%;
  border:0;
  background:var(--pink);
  color:white;
  border-radius:12px;
  padding:11px;
  margin-top:10px;
  font-weight:bold;
}

.out{
  background:#ddd;
  color:#777;
}

.loading,
.error-box,
.empty{
  grid-column:1/-1;
  background:white;
  padding:35px;
  text-align:center;
  border-radius:20px;
  color:var(--muted);
}

.error-box{
  color:#b52b4c;
  background:#fff0f3;
}

.footer{
  background:#fff;
  border-top:1px solid #f2dfe8;
  padding:30px 16px;
  text-align:center;
  color:var(--muted);
  line-height:2;
}

.overlay{
  position:fixed;
  inset:0;
  background:#0008;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:14px;
}

.modal{
  width:100%;
  max-width:560px;
  max-height:92vh;
  overflow:auto;
  background:white;
  border-radius:24px;
  padding:20px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.close{
  width:38px;
  height:38px;
  border:0;
  border-radius:50%;
  background:#ffe7f0;
  color:#d02d6c;
  font-size:22px;
}

.detail-image{
  width:100%;
  max-height:330px;
  object-fit:cover;
  border-radius:18px;
  background:#fff0f6;
}

.detail-price{
  color:#d42d6e;
  font-weight:900;
  font-size:22px;
  margin:12px 0;
}

.detail-desc{
  color:#76636d;
  line-height:2;
}

.primary{
  width:100%;
  border:0;
  border-radius:13px;
  background:var(--pink);
  color:white;
  padding:13px;
  font-weight:bold;
  margin-top:12px;
}

.cart-list{
  display:grid;
  gap:10px;
}

.cart-item{
  display:grid;
  grid-template-columns:65px 1fr;
  gap:10px;
  border-bottom:1px solid #f1e3e9;
  padding-bottom:12px;
}

.cart-item img{
  width:65px;
  height:65px;
  object-fit:cover;
  border-radius:12px;
}

.cart-name{
  font-weight:bold;
  font-size:13px;
}

.qty{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:8px;
}

.qty button{
  border:0;
  width:30px;
  height:30px;
  border-radius:9px;
  background:#ffe8f1;
  color:#c72d6b;
}

.remove{
  border:0;
  background:none;
  color:#d83255;
  font-size:11px;
}

.total{
  display:flex;
  justify-content:space-between;
  margin-top:18px;
  padding-top:14px;
  border-top:1px solid #eadce2;
  font-weight:bold;
}

.form{
  display:grid;
  gap:10px;
}

.form label{
  font-size:12px;
  font-weight:bold;
}

.form input,
.form textarea,
.form select{
  width:100%;
  padding:12px;
  border:1px solid var(--border);
  border-radius:12px;
  outline:none;
  background:#fffafd;
}

.form textarea{
  min-height:85px;
  resize:vertical;
}

.toast{
  position:fixed;
  bottom:20px;
  right:50%;
  transform:translateX(50%);
  z-index:300;
  background:#342530;
  color:white;
  padding:12px 18px;
  border-radius:13px;
  font-size:12px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
}

.toast.show{
  opacity:1;
}

.account-box{
  text-align:center;
}

.order{
  border:1px solid var(--border);
  border-radius:15px;
  padding:12px;
  margin-bottom:10px;
}

.order strong{
  color:#d32f6d;
}

@media(max-width:850px){
  .products{
    grid-template-columns:repeat(3,1fr);
  }
}

@media(max-width:600px){

  .header-inner{
    flex-wrap:wrap;
  }

  .logo{
    width:100%;
  }

  .search{
    order:3;
    width:100%;
    flex-basis:100%;
  }

  .products{
    grid-template-columns:repeat(2,1fr);
    gap:10px;
  }

  .hero{
    margin:10px 0;
    border-radius:20px;
    padding:25px 18px;
  }

  .hero h1{
    font-size:25px;
  }

}

</style>
</head>

<script>

const SUPABASE_URL =
  "https://wyqxeoscfaypyghrtumf.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_rsIfojM5qx8_vlE82eHL0w_jzymrVX4";

const { createClient } = supabase;

const db = createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


let products = [];
let filteredProducts = [];

let currentCategory = "همه";
let searchText = "";
let currentProduct = null;


let cart =
  JSON.parse(
    localStorage.getItem("velora_cart") || "[]"
  );

let favorites =
  JSON.parse(
    localStorage.getItem("velora_favorites") || "[]"
  );

let user =
  JSON.parse(
    localStorage.getItem("velora_user") || "null"
  );

let orders =
  JSON.parse(
    localStorage.getItem("velora_orders") || "[]"
  );


const $ = id =>
  document.getElementById(id);


function money(value){

  return Number(value || 0)
    .toLocaleString("fa-IR") +
    " تومان";

}


function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function toast(message){

  const el = $("toast");

  el.textContent = message;

  el.classList.add("show");

  clearTimeout(window.__toast);

  window.__toast =
    setTimeout(
      () => el.classList.remove("show"),
      2200
    );

}


function saveCart(){

  localStorage.setItem(
    "velora_cart",
    JSON.stringify(cart)
  );

}


function saveFavorites(){

  localStorage.setItem(
    "velora_favorites",
    JSON.stringify(favorites)
  );

}


function saveUser(){

  localStorage.setItem(
    "velora_user",
    JSON.stringify(user)
  );

}


function saveOrders(){

  localStorage.setItem(
    "velora_orders",
    JSON.stringify(orders)
  );

}


function getImageUrl(product){

  const image =
    product?.image_url || "";

  if(!image){

    return "https://placehold.co/600x600/fff0f6/d42d6e?text=VELORA";

  }


  if(
    image.startsWith("http://") ||
    image.startsWith("https://") ||
    image.startsWith("data:")
  ){

    return image;

  }


  return (
    "https://tj468633-hash.github.io/" +
    "Taha-mini-app/" +
    image.replace(/^\.?\//,"")
  );

}


function normalizeProduct(product){

  return {

    ...product,

    id:String(product.id),

    name:
      product.name ||
      "محصول VELORA",

    price:
      Number(product.price || 0),

    stock:
      Number(product.stock || 0),

    category:
      product.category ||
      "اکسسوری",

    subcategory:
      product.subcategory ||
      "",

    description:
      product.description ||
      "",

    image_url:
      product.image_url ||
      ""

  };

}


/*
========================================
دریافت محصولات واقعی از Supabase
========================================

نکته مهم:

اینجا دیگر DEFAULT_PRODUCTS نداریم.

اطلاعاتی که در پنل مدیریت تغییر می‌دهی،
مستقیماً از جدول products خوانده می‌شود.

پس اگر مثلاً اسم محصول را در پنل
از «گل‌سر پاپیونی توری» به اسم دیگری
تغییر بدهی، بعد از رفرش سایت همان
اسم جدید نمایش داده خواهد شد.
*/


async function loadProducts(){

  $("productStatus").textContent =
    "در حال دریافت...";


  $("products").innerHTML =
    `
      <div class="loading">
        در حال دریافت محصولات از فروشگاه...
      </div>
    `;


  const result =
    await db
      .from("products")
      .select("*")
      .order(
        "created_at",
        {
          ascending:true
        }
      );


  if(result.error){

    console.error(
      "Supabase products error:",
      result.error
    );


    $("productStatus").textContent =
      "خطا";


    $("products").innerHTML =
      `
        <div class="error-box">

          دریافت محصولات از پایگاه داده انجام نشد.

          <br><br>

          ${escapeHTML(
            result.error.message
          )}

        </div>
      `;


    return;

  }


  /*
    این خط خیلی مهم است.

    اطلاعات قبلی products کاملاً
    با اطلاعات فعلی دیتابیس جایگزین
    می‌شود.

    یعنی دیگر اطلاعات قدیمی یا
    DEFAULT_PRODUCTS روی اطلاعات
    پنل مدیریت غلبه نمی‌کند.
  */

  products =
    (result.data || [])
      .map(normalizeProduct);


  if(!products.length){

    $("productStatus").textContent =
      "۰ محصول";


    $("products").innerHTML =
      `
        <div class="empty">

          هنوز محصولی در فروشگاه ثبت نشده است.

        </div>
      `;


    renderCategories();

    updateBadges();

    return;

  }


  $("productStatus").textContent =
    products.length.toLocaleString("fa-IR") +
    " محصول";


  renderCategories();

  applyFilters();

  renderCart();

  renderFavorites();

  updateBadges();

}


function renderCategories(){

  const categories = [

    "همه",

    ...new Set(

      products
        .map(
          product =>
            product.category
        )
        .filter(Boolean)

    )

  ];


  $("categories").innerHTML =

    categories
      .map(
        category => `

          <button

            class="category ${
              currentCategory === category
                ? "active"
                : ""
            }"

            type="button"

            data-category="${escapeHTML(
              category
            )}"

          >

            ${escapeHTML(category)}

          </button>

        `
      )
      .join("");

}


function applyFilters(){

  filteredProducts =
    products.filter(
      product => {

        const categoryOK =
          currentCategory === "همه" ||
          product.category ===
            currentCategory;


        const q =
          searchText
            .trim()
            .toLowerCase();


        const text =
          (
            product.name +
            " " +
            product.description +
            " " +
            product.category +
            " " +
            product.subcategory
          )
          .toLowerCase();


        const searchOK =
          !q ||
          text.includes(q);


        return (
          categoryOK &&
          searchOK
        );

      }
    );


  renderProducts();

}


function renderProducts(){

  if(!filteredProducts.length){

    $("products").innerHTML =

          محصولی مطابق جستجو پیدا نشد.

        </div>
      `;

    filteredProducts
      .map(
        product => {

          const liked =

            );


          const soldOut =
            product.stock <= 0;


          return `

            <article

              class="product-card"

              data-product="${escapeHTML(
                product.id

            >

              <div
                class="product-image-wrap"

                  src="${escapeHTML(
                    getImageUrl(product)
                  )}"

                  alt="${escapeHTML(
                    product.name
                  )}"

                  "

                >


                <button

                  class="favorite ${
                    liked
                      ? "active"
                      : ""
                  }"

                  type="button"

                  data-favorite="${escapeHTML(
                    product.id
                  )}"

                  aria-label="علاقه‌مندی"

                >

                  ${
                    liked
                      ? "♥"
                      : "♡"
                  }

                </button>

              </div>


              <div class="product-body">

                <div class="product-name">

                  ${escapeHTML(
                    product.name
                  )}

                </div>


                <div class="product-desc">

                  ${escapeHTML(
                    product.description
                  )}

                </div>


                <div class="product-bottom">

                  <span class="price">

                    ${money(
                      product.price

                        : "موجودی " +

                            .toLocaleString(

                            )

                  </span>

                </div>


                <button

                  class="add-btn ${

                  data-add="${escapeHTML(
                    product.id
                  )}"

      .join("");

}


function findProduct(id){

  return products.find(
    product =>
      String(product.id) ===
      String(id)
  );

}


function addToCart(id){

  const product =
    findProduct(id);


  if(!product){

    return;

  }


  if(product.stock <= 0){

    toast(
      "این محصول موجود نیست."
    );

    return;

  }


  const existing =
    cart.find(
      item =>
        String(item.id) ===
        String(id)
    );


  if(existing){

    if(
      existing.qty >=
      product.stock
    ){

      toast(
        "بیشتر از موجودی نمی‌توانی اضافه کنی."
      );

      return;

    }


    existing.qty += 1;

  }else{

    cart.push({

      id:String(
        product.id
      ),

      qty:1

    });

  }


  saveCart();

  renderCart();

  updateBadges();

  toast(
    "محصول به سبد اضافه شد 🛒"
  );

}


function removeFromCart(id){

  cart =
    cart.filter(
      item =>
        String(item.id) !==
        String(id)
    );


  saveCart();

  renderCart();

  updateBadges();

}


function changeQuantity(
  id,
  delta
){

  const item =
    cart.find(
      x =>
        String(x.id) ===
        String(id)
    );


  if(!item){

    return;

  }


  const product =
    findProduct(id);


  if(!product){

    return;

  }


  item.qty += delta;


  if(item.qty <= 0){

    removeFromCart(id);

    return;

  }


  if(
    item.qty >
    product.stock
  ){

    item.qty =
      product.stock;


    toast(
      "به سقف موجودی رسیدی."
    );

  }


  saveCart();

  renderCart();

  updateBadges();

}


function cartItems(){

  return cart

    .map(item => {

      const product =
        findProduct(
          item.id
        );


      if(!product){

        return null;

      }


      return {

        product,

        qty:
          Number(
            item.qty || 0
          )

      };

    })

    .filter(Boolean);

}


function cartTotal(){

  return cartItems()
    .reduce(

      (
        sum,
        item
      ) =>

        sum +
        item.product.price *
        item.qty,

      0

    );

}


function renderCart(){

  const items =
    cartItems();


  if(!items.length){

    $("cartList").innerHTML =
      `
        <div class="empty">

          سبد خرید خالی است 🛒

        </div>
      `;


    $("cartTotal").textContent =
      "۰ تومان";


    return;

  }


  $("cartList").innerHTML =

    items
      .map(
        ({
          product,
          qty
        }) => `

          <div class="cart-item">

            <img

              src="${escapeHTML(
                getImageUrl(product)
              )}"

              alt=""

            >


            <div>

              <div class="cart-name">

                ${escapeHTML(
                  product.name
                )}

              </div>


              <div class="price">

                ${money(
                  product.price *
                  qty
                )}

              </div>


              <div class="qty">

                <button

                  type="button"

                  data-minus="${escapeHTML(
                    product.id
                  )}"

                >
                  −
                </button>


                <strong>

                  ${qty.toLocaleString(
                    "fa-IR"
                  )}

                </strong>


                <button

                  type="button"

                  data-plus="${escapeHTML(
                    product.id
                  )}"

                >
                  +
                </button>


                <button

                  class="remove"

                  type="button"

                  data-remove="${escapeHTML(
                    product.id
                  )}"

                >
                  حذف
                </button>

              </div>

            </div>

          </div>

        `
      )
      .join("");


  $("cartTotal").textContent =
    money(
      cartTotal()
    );

}


function updateBadges(){

  const cartCount =
    cart.reduce(

      (
        sum,
        item
      ) =>

        sum +
        Number(
          item.qty || 0
        ),

      0

    );


  $("cartCount").textContent =
    cartCount.toLocaleString(
      "fa-IR"
    );


  $("favoriteCount").textContent =
    favorites.length.toLocaleString(
      "fa-IR"
    );

}
  function openProduct(id){

  const product =
    findProduct(id);

  if(!product){
    return;
  }

  currentProduct =
    product;

  $("detailName").textContent =
    product.name;

  $("detailImage").src =
    getImageUrl(product);

  $("detailImage").alt =
    product.name;

  $("detailPrice").textContent =
    money(product.price);

  $("detailStock").textContent =
    product.stock > 0
      ? "موجودی: " +
        product.stock.toLocaleString("fa-IR")
      : "ناموجود";

  $("detailDescription").textContent =
    product.description ||
    "توضیحاتی برای این محصول ثبت نشده است.";

  $("detailAdd").disabled =
    product.stock <= 0;

  $("detailAdd").textContent =
    product.stock > 0
      ? "افزودن به سبد خرید"
      : "ناموجود";

  updateDetailFavorite();

  $("productOverlay")
    .classList.remove("hidden");

}


function updateDetailFavorite(){

  if(!currentProduct){
    return;
  }

  const liked =
    favorites.includes(
      String(currentProduct.id)
    );

  $("detailFavorite").textContent =
    liked
      ? "♥ حذف از علاقه‌مندی"
      : "♡ افزودن به علاقه‌مندی";

}


function toggleFavorite(id){

  id = String(id);

  if(
    favorites.includes(id)
  ){

    favorites =
      favorites.filter(
        x =>
          String(x) !== id
      );

    toast(
      "از علاقه‌مندی حذف شد."
    );

  }else{

    favorites.push(id);

    toast(
      "به علاقه‌مندی اضافه شد ❤️"
    );

  }

  saveFavorites();

  renderProducts();

  renderFavorites();

  updateBadges();

  updateDetailFavorite();

}

function renderOrders(){

  const area =
    $("ordersArea");

  if(!area){
    return;
  }

  if(!orders.length){

    area.innerHTML =
      `
        <div class="empty">
          هنوز سفارشی ثبت نکردی.
        </div>
      `;

    return;

  }

  area.innerHTML =
    orders
      .slice()
      .reverse()
      .map(
        order => `

          <div class="order">

            <strong>
              سفارش
              ${escapeHTML(
                order.id
              )}
            </strong>

            <br>

            ${escapeHTML(
              order.date
            )}

      .join("");

}


function openCheckout(){

  if(!cartItems().length){

    toast(
      "سبد خرید خالی است."
    );

    return;

  }

  if(user){

    $("customerName").value =
      user.name || "";

    $("customerPhone").value =
      user.phone || "";

  }

  $("checkoutOverlay")
    .classList.remove("hidden");

}


function closeAllOverlays(){

  document
    .querySelectorAll(".overlay")
    .forEach(
      el =>
        el.classList.add(
          "hidden"
        )
    );

}


async function submitOrder(event){

  event.preventDefault();

  const items =
    cartItems();

  if(!items.length){

    toast(
      "سبد خرید خالی است."
    );

    return;

  }


  const order = {

    id:
      "VLR-" +
      Date.now()
        .toString()
        .slice(-8),

    date:
      new Date()
        .toLocaleString(
          "fa-IR"
        ),

    total:
      cartTotal(),

    customer:{

      name:
        $("customerName")
          .value
          .trim(),

      phone:
        $("customerPhone")
          .value
          .trim(),

      province:
        $("province")
          .value
          .trim(),

      city:
        $("city")
          .value
          .trim(),

      address:
        $("address")
          .value
          .trim(),

      postalCode:
        $("postalCode")
          .value
          .trim(),

      note:
        $("orderNote")
          .value
          .trim()

    },

    items:
      items.map(
        ({
          product,
          qty
        }) => ({

          productId:
            product.id,

          name:
            product.name,

          price:
            product.price,

          qty:
            qty

        })
      )

  };


  orders.push(order);

  saveOrders();


  /*
    در این مرحله سفارش به صورت
    محلی ذخیره می‌شود.
    اتصال کامل و امن سفارش‌ها به
    جدول orders را در مرحله بعد
    انجام می‌دهیم.
  */


  cart = [];

  saveCart();

  renderCart();

  updateBadges();

  closeAllOverlays();

  toast(
    "سفارش با موفقیت ثبت شد 🎉"
  );

}
  <script>

   VELORA STORE - FINAL SAFE EVENTS
========================================= */

function bind(id, event, handler){

  const el = document.getElementById(id);

  if(!el){
    console.warn("Element not found:", id);
    return;
  }

  el.addEventListener(event, handler);

}


/* =========================================
   SEARCH
========================================= */

bind(
  "searchInput",
  "input",
  function(event){

    searchText =
      event.target.value.trim();

    applyFilters();

  }
);


/* =========================================
   CATEGORIES
========================================= */

bind(
  "categories",
  "click",
  function(event){

    const button =
      event.target.closest(
        "[data-category]"
      );

    if(!button){
      return;
    }

    currentCategory =
      button.dataset.category;

    renderCategories();

    applyFilters();

  }
);


/* =========================================
   PRODUCTS
========================================= */

bind(
  "products",
  "click",
  function(event){

    const add =
      event.target.closest(
        "[data-add]"
      );

    if(add){

      event.stopPropagation();

      addToCart(
        add.dataset.add
      );

      return;

    }


    const favorite =
      event.target.closest(
        "[data-favorite]"
      );

    if(favorite){

      event.stopPropagation();

      toggleFavorite(
        favorite.dataset.favorite
      );

      return;

    }


    const product =
      event.target.closest(
        "[data-product]"
      );

    if(product){

      openProduct(
        product.dataset.product
      );

    }

  }
);


/* =========================================
   CART
========================================= */

bind(
  "cartList",
  "click",
  function(event){

    const plus =
      event.target.closest(
        "[data-plus]"
      );

    if(plus){

      changeQuantity(
        plus.dataset.plus,
        1
      );

      return;

    }


    const minus =
      event.target.closest(
        "[data-minus]"
      );

    if(minus){

      changeQuantity(
        minus.dataset.minus,
        -1
      );

      return;

    }


    const remove =
      event.target.closest(
        "[data-remove]"
      );

    if(remove){

      removeFromCart(
        remove.dataset.remove
      );

    }

  }
);

  function(event){
