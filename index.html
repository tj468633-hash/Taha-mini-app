<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TaHa</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #222 0%, #090909 35%, #000 70%);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 480px;
      margin: auto;
      padding: 24px 18px 30px;
    }

    /* Header */

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .menu {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: #171717;
      border: 1px solid #292929;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    /* Welcome */

    .welcome {
      margin-bottom: 22px;
    }

    .welcome small {
      color: #888;
      font-size: 14px;
    }

    .welcome h1 {
      margin: 6px 0 0;
      font-size: 30px;
      letter-spacing: -1px;
    }

    /* Main card */

    .main-card {
      position: relative;
      overflow: hidden;
      background: linear-gradient(145deg, #1c1c1c, #101010);
      border: 1px solid #2b2b2b;
      border-radius: 24px;
      padding: 25px;
      margin-bottom: 16px;
    }

    .main-card::after {
      content: "";
      position: absolute;
      width: 160px;
      height: 160px;
      background: #fff;
      opacity: 0.035;
      border-radius: 50%;
      left: -60px;
      top: -70px;
    }

    .main-icon {
      font-size: 38px;
      margin-bottom: 12px;
    }

    .main-card h2 {
      margin: 0 0 8px;
      font-size: 22px;
    }

    .main-card p {
      margin: 0;
      color: #999;
      line-height: 1.7;
      font-size: 14px;
    }

    .primary-button {
      width: 100%;
      margin-top: 20px;
      border: none;
      border-radius: 15px;
      padding: 15px;
      background: #fff;
      color: #000;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    .primary-button:active {
      transform: scale(0.98);
    }

    /* Features */

    .section-title {
      font-size: 15px;
      color: #888;
      margin: 22px 4px 12px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .card {
      background: #111;
      border: 1px solid #252525;
      border-radius: 20px;
      padding: 20px 16px;
      cursor: pointer;
      transition: 0.2s;
    }

    .card:active {
      transform: scale(0.97);
      background: #181818;
    }

    .card-icon {
      font-size: 25px;
      margin-bottom: 12px;
    }

    .card h3 {
      margin: 0 0 5px;
      font-size: 15px;
    }

    .card p {
      margin: 0;
      color: #777;
      font-size: 12px;
    }

    /* Bottom */

    .footer {
      text-align: center;
      color: #555;
      font-size: 12px;
      margin-top: 30px;
    }

    /* Toast */

    .toast {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #fff;
      color: #000;
      padding: 12px 20px;
      border-radius: 14px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: 0.3s;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>

<body>

  <main class="container">

    <header class="header">
      <div class="logo">TaHa</div>

      <div class="menu">
        ⋯
      </div>
    </header>

    <section class="welcome">
      <small>خوش آمدی 👋</small>
      <h1>فضای شخصی تو</h1>
    </section>

    <section class="main-card">

      <div class="main-icon">💬</div>

      <h2>پیام ناشناس</h2>

      <p>
        لینک اختصاصی خودت را بساز و اجازه بده
        دیگران به صورت ناشناس برایت پیام بفرستند.
      </p>

      <button class="primary-button" onclick="showToast('این قابلیت به‌زودی فعال می‌شود 🚀')">
        شروع کنید
      </button>

    </section>

    <div class="section-title">
      امکانات TaHa
    </div>

    <section class="grid">

      <div class="card" onclick="showToast('پیام‌های من به‌زودی فعال می‌شود')">
        <div class="card-icon">📥</div>
        <h3>پیام‌های من</h3>
        <p>پیام‌های دریافتی</p>
      </div>

      <div class="card" onclick="showToast('پروفایل به‌زودی فعال می‌شود')">
        <div class="card-icon">👤</div>
        <h3>پروفایل</h3>
        <p>اطلاعات حساب</p>
      </div>

      <div class="card" onclick="showToast('لینک اختصاصی به‌زودی فعال می‌شود')">
        <div class="card-icon">🔗</div>
        <h3>لینک من</h3>
        <p>اشتراک‌گذاری TaHa</p>
      </div>

      <div class="card" onclick="showToast('تنظیمات به‌زودی فعال می‌شود')">
        <div class="card-icon">⚙️</div>
        <h3>تنظیمات</h3>
        <p>تنظیمات حساب</p>
      </div>

    </section>

    <div class="footer">
      TaHa • ساخته شده برای تلگرام
    </div>

  </main>

  <div class="toast" id="toast"></div>

  <script>

    function showToast(message) {

      const toast = document.getElementById("toast");

      toast.textContent = message;

      toast.classList.add("show");

      setTimeout(() => {
        toast.classList.remove("show");
      }, 2500);
    }

  </script>

</body>
</html>
