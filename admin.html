<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>پنل مدیریت | VELORA STORE</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  font-family:Tahoma,Arial,sans-serif;
}

body{
  margin:0;
  background:#fff7fb;
  color:#352630;
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

.topbar{
  background:linear-gradient(135deg,#ff79ad,#ff4f91);
  color:white;
  padding:18px;
  box-shadow:0 5px 25px #0002;
}

.topbar-inner{
  max-width:1100px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.logo{
  font-size:23px;
  font-weight:900;
}

.logo small{
  display:block;
  font-size:11px;
  margin-top:4px;
  opacity:.85;
}

.logout{
  border:0;
  background:white;
  color:#e23d7d;
  padding:10px 17px;
  border-radius:12px;
  font-weight:bold;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.login-box{
  width:calc(100% - 30px);
  max-width:430px;
  margin:70px auto;
  background:white;
  padding:28px;
  border-radius:25px;
  box-shadow:0 10px 45px #e83d7e18;
}

.login-logo{
  text-align:center;
  font-size:32px;
  font-weight:900;
  color:#e83d7e;
  margin-bottom:8px;
}

.login-title{
  text-align:center;
  margin:0 0 8px;
}

.muted{
  color:#8d7c85;
  font-size:13px;
  line-height:1.8;
}

.center{
  text-align:center;
}

label{
  display:block;
  margin:15px 0 7px;
  font-size:14px;
  font-weight:bold;
}

input,
select,
textarea{
  width:100%;
  padding:13px;
  border:1px solid #ead9e2;
  background:#fffafd;
  border-radius:13px;
  outline:none;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#ff69a2;
  box-shadow:0 0 0 3px #ff69a21c;
}

textarea{
  min-height:100px;
  resize:vertical;
}

.btn{
  border:0;
  border-radius:12px;
  padding:12px 17px;
  font-weight:bold;
}

.btn-primary{
  background:#ff599d;
  color:white;
}

.btn-secondary{
  background:#f9e8ef;
  color:#a52e61;
}

.btn-danger{
  background:#ffe2e9;
  color:#c62d50;
}

.full-btn{
  width:100%;
  margin-top:18px;
}

.message{
  margin-top:12px;
  padding:11px;
  border-radius:12px;
  font-size:13px;
  line-height:1.8;
}

.error{
  background:#ffe5ea;
  color:#b52849;
}

.success{
  background:#e5fff1;
  color:#167349;
}

.dashboard{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-bottom:20px;
}

.stat{
  background:white;
  padding:20px;
  border-radius:20px;
  box-shadow:0 5px 25px #00000008;
}

.stat-title{
  color:#8d7c85;
  font-size:13px;
  margin-bottom:8px;
}

.stat-value{
  color:#e83d7e;
  font-size:26px;
  font-weight:900;
}

.panel{
  background:white;
  padding:20px;
  border-radius:22px;
  box-shadow:0 5px 25px #00000008;
  margin-bottom:20px;
}

.panel-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:18px;
}

.panel-title{
  margin:0 0 5px;
}

.products{
  display:grid;
  gap:12px;
}

.product{
  display:grid;
  grid-template-columns:75px 1fr auto;
  gap:14px;
  align-items:center;
  border:1px solid #f0e1e8;
  border-radius:17px;
  padding:12px;
}

.product-image{
  width:75px;
  height:75px;
  object-fit:cover;
  border-radius:14px;
  background:#fff0f6;
}

.product-name{
  font-weight:bold;
  margin-bottom:6px;
}

.product-info{
  color:#8d7c85;
  font-size:12px;
  line-height:1.9;
}

.actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  justify-content:flex-end;
}

.actions .btn{
  padding:9px 12px;
  font-size:12px;
}

.empty{
  text-align:center;
  color:#98858e;
  padding:35px 15px;
}

.modal{
  position:fixed;
  inset:0;
  background:#0008;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.modal-box{
  width:100%;
  max-width:580px;
  max-height:92vh;
  overflow:auto;
  background:white;
  border-radius:24px;
  padding:22px;
}

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:15px;
}

.close{
  width:38px;
  height:38px;
  border:0;
  border-radius:50%;
  background:#ffe8f1;
  color:#d92e6e;
  font-size:22px;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.full{
  grid-column:1/-1;
}

.modal-actions{
  display:flex;
  gap:10px;
  margin-top:18px;
}

.modal-actions .btn{
  flex:1;
}

@media(max-width:700px){

  .dashboard{
    grid-template-columns:1fr;
  }

  .product{
    grid-template-columns:60px 1fr;
  }

  .product-image{
    width:60px;
    height:60px;
  }

  .actions{
    grid-column:1/-1;
    justify-content:stretch;
  }

  .actions .btn{
    flex:1;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .container{
    padding:12px;
  }
}
</style>
</head>

<body>

<section id="loginScreen">

  <div class="login-box">

    <div class="login-logo">
      VELORA
    </div>

    <h2 class="login-title">
      پنل مدیریت فروشگاه
    </h2>

    <p class="muted center">
      ورود مخصوص مدیریت VELORA STORE
    </p>

    <label for="email">
      ایمیل
    </label>

    <input
      id="email"
      type="email"
      autocomplete="username"
      placeholder="ایمیل مدیریت"
    >

    <label for="password">
      رمز عبور
    </label>

    <input
      id="password"
      type="password"
      autocomplete="current-password"
      placeholder="رمز عبور"
    >

    <button
      id="loginButton"
      class="btn btn-primary full-btn"
      type="button"
    >
      ورود به پنل
    </button>

    <div id="loginMessage"></div>

  </div>

</section>


<section id="adminScreen" class="hidden">

<header class="topbar">

  <div class="topbar-inner">

    <div class="logo">
      VELORA STORE
      <small>پنل مدیریت</small>
    </div>

    <button
      id="logoutButton"
      class="logout"
      type="button"
    >
      خروج
    </button>

  </div>

</header>

<main class="container">

  <div class="dashboard">

    <div class="stat">
      <div class="stat-title">
        تعداد محصولات
      </div>
      <div id="statProducts" class="stat-value">
        ۰
      </div>
    </div>

    <div class="stat">
      <div class="stat-title">
        مجموع موجودی
      </div>
      <div id="statStock" class="stat-value">
        ۰
      </div>
    </div>

    <div class="stat">
      <div class="stat-title">
        ارزش موجودی
      </div>
      <div id="statValue" class="stat-value">
        ۰
      </div>
    </div>

  </div>


  <section class="panel">

    <div class="panel-head">

      <div>
        <h2 class="panel-title">
          مدیریت محصولات
        </h2>

        <div class="muted">
          اضافه، ویرایش و حذف محصولات
        </div>
      </div>

      <button
        id="addButton"
        class="btn btn-primary"
        type="button"
      >
        + افزودن محصول
      </button>

    </div>

    <div id="productsList" class="products">
    </div>

  </section>

</main>

</section>


<div id="productModal" class="modal hidden">

  <div class="modal-box">

    <div class="modal-head">

      <h2 id="modalTitle">
        افزودن محصول
      </h2>

      <button
        id="closeButton"
        class="close"
        type="button"
      >
        ×
      </button>

    </div>

    <input
      id="productId"
      type="hidden"
    >

    <div class="form-grid">

      <div class="full">

        <label>
          نام محصول
        </label>

        <input
          id="productName"
          placeholder="مثلاً گل‌سر پاپیونی توری"
        >

      </div>

      <div>

        <label>
          قیمت
        </label>

        <input
          id="productPrice"
          type="number"
          min="0"
          placeholder="290000"
        >

      </div>

      <div>

        <label>
          موجودی
        </label>

        <input
          id="productStock"
          type="number"
          min="0"
          placeholder="13"
        >

      </div>

      <div>

        <label>
          دسته‌بندی
        </label>

        <select id="productCategory">
          <option value="اکسسوری">اکسسوری</option>
          <option value="تزئینات">تزئینات</option>
          <option value="آشپزخانه">آشپزخانه</option>
        </select>

      </div>

      <div>

        <label>
          زیر دسته
        </label>

        <input
          id="productSubcategory"
          placeholder="گیر سر"
        >

      </div>

      <div class="full">

        <label>
          آدرس عکس
        </label>

        <input
          id="productImage"
          placeholder="https://..."
        >

        <div class="muted">
          آپلود مستقیم عکس را در مرحله بعد اضافه می‌کنیم.
        </div>

      </div>

      <div class="full">

        <label>
          توضیحات
        </label>

        <textarea
          id="productDescription"
          placeholder="توضیحات محصول..."
        ></textarea>

      </div>

    </div>

    <div id="formMessage"></div>

    <div class="modal-actions">

      <button
        id="saveButton"
        class="btn btn-primary"
        type="button"
      >
        ذخیره
      </button>

      <button
        id="cancelButton"
        class="btn btn-secondary"
        type="button"
      >
        انصراف
      </button>

    </div>

  </div>

</div>

<script>
  const SUPABASE_URL =
  "https://wyqxeoscfaypyghrtumf.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_rsIfojM5qx8_vlE82eHL0w_jzymrVX4";

const { createClient } = supabase;

const db = createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


let products = [];


const loginScreen =
  document.getElementById("loginScreen");

const adminScreen =
  document.getElementById("adminScreen");

const emailInput =
  document.getElementById("email");

const passwordInput =
  document.getElementById("password");

const loginButton =
  document.getElementById("loginButton");

const loginMessage =
  document.getElementById("loginMessage");

const logoutButton =
  document.getElementById("logoutButton");

const productsList =
  document.getElementById("productsList");

const productModal =
  document.getElementById("productModal");

const formMessage =
  document.getElementById("formMessage");


function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function money(value){

  return Number(value || 0)
    .toLocaleString("fa-IR") +
    " تومان";

}


function showLoginError(message){

  loginMessage.innerHTML =
    '<div class="message error">' +
    escapeHTML(message) +
    '</div>';

}


function showFormMessage(message,type){

  formMessage.innerHTML =
    '<div class="message ' +
    (type || "error") +
    '">' +
    escapeHTML(message) +
    '</div>';

}


function showLogin(){

  loginScreen.classList.remove("hidden");

  adminScreen.classList.add("hidden");

}


function showAdmin(){

  loginScreen.classList.add("hidden");

  adminScreen.classList.remove("hidden");

}


async function checkSession(){

  const result =
    await db.auth.getSession();

  if(result.error){

    showLoginError(
      result.error.message
    );

    return;

  }

  if(!result.data.session){

    showLogin();

    return;

  }

  await verifyAdmin();

}


async function verifyAdmin(){

  const result =
    await db.rpc("is_admin");

  if(result.error){

    showLoginError(
      "خطا در بررسی دسترسی مدیر: " +
      result.error.message
    );

    return;

  }

  if(result.data !== true){

    await db.auth.signOut();

    showLogin();

    showLoginError(
      "این حساب دسترسی مدیر ندارد."
    );

    return;

  }

  showAdmin();

  await loadProducts();

}


async function login(){

  const email =
    emailInput.value.trim();

  const password =
    passwordInput.value;

  loginMessage.innerHTML = "";

  if(!email){

    showLoginError(
      "ایمیل را وارد کن."
    );

    return;

  }

  if(!password){

    showLoginError(
      "رمز عبور را وارد کن."
    );

    return;

  }

  loginButton.disabled = true;

  loginButton.textContent =
    "در حال ورود...";


  const result =
    await db.auth.signInWithPassword({
      email:email,
      password:password
    });


  loginButton.disabled = false;

  loginButton.textContent =
    "ورود به پنل";


  if(result.error){

    showLoginError(
      "ورود انجام نشد: " +
      result.error.message
    );

    return;

  }


  await verifyAdmin();

}


loginButton.addEventListener(
  "click",
  login
);


passwordInput.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Enter"){
      login();
    }

  }
);


emailInput.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Enter"){
      login();
    }

  }
);


logoutButton.addEventListener(
  "click",
  async function(){

    await db.auth.signOut();

    showLogin();

    emailInput.value = "";

    passwordInput.value = "";

  }
);


db.auth.onAuthStateChange(
  function(event,session){

    if(event === "SIGNED_OUT"){
      showLogin();
    }

  }
);
  async function loadProducts(){

  productsList.innerHTML =
    '<div class="empty">در حال دریافت محصولات...</div>';


  const result =
    await db
      .from("products")
      .select("*")
      .order("created_at",{
        ascending:false
      });


  if(result.error){

    productsList.innerHTML =
      '<div class="message error">' +
      escapeHTML(
        result.error.message
      ) +
      '</div>';

    return;

  }


  products =
    result.data || [];

  renderProducts();

  updateStats();

}


function renderProducts(){

  if(!products.length){

    productsList.innerHTML =
      '<div class="empty">' +
      'هنوز محصولی وجود ندارد.' +
      '</div>';

    return;

  }


  productsList.innerHTML =
    products.map(function(product){

      const image =
        product.image_url ||
        "https://placehold.co/150x150?text=VELORA";


      return `
        <div class="product">

          <img
            class="product-image"
            src="${escapeHTML(image)}"
            onerror="this.src='https://placehold.co/150x150?text=VELORA'"
          >

          <div>

            <div class="product-name">
              ${escapeHTML(product.name)}
            </div>

            <div class="product-info">

              قیمت:
              ${money(product.price)}

              <br>

              موجودی:
              ${Number(product.stock || 0)
                .toLocaleString("fa-IR")}

              <br>

              دسته:
              ${escapeHTML(product.category || "-")}

              ${
                product.subcategory
                ? " / " +
                  escapeHTML(product.subcategory)
                : ""
              }

            </div>

          </div>

          <div class="actions">

            <button
              class="btn btn-secondary"
              type="button"
              onclick="editProduct('${product.id}')"
            >
              ✏️ ویرایش
            </button>

            <button
              class="btn btn-danger"
              type="button"
              onclick="deleteProduct('${product.id}')"
            >
              🗑️ حذف
            </button>

          </div>

        </div>
      `;

    }).join("");

}


function updateStats(){

  const count =
    products.length;


  const stock =
    products.reduce(
      function(total,product){
        return total +
          Number(product.stock || 0);
      },
      0
    );


  const value =
    products.reduce(
      function(total,product){

        return total +
          Number(product.stock || 0) *
          Number(product.price || 0);

      },
      0
    );


  document.getElementById(
    "statProducts"
  ).textContent =
    count.toLocaleString("fa-IR");


  document.getElementById(
    "statStock"
  ).textContent =
    stock.toLocaleString("fa-IR");


  document.getElementById(
    "statValue"
  ).textContent =
    money(value);

}


function clearForm(){

  document.getElementById(
    "productId"
  ).value = "";

  document.getElementById(
    "productName"
  ).value = "";

  document.getElementById(
    "productPrice"
  ).value = "";

  document.getElementById(
    "productStock"
  ).value = "";

  document.getElementById(
    "productCategory"
  ).value =
    "اکسسوری";

  document.getElementById(
    "productSubcategory"
  ).value = "";

  document.getElementById(
    "productImage"
  ).value = "";

  document.getElementById(
    "productDescription"
  ).value = "";

  formMessage.innerHTML = "";

}


function openAddModal(){

  clearForm();

  document.getElementById(
    "modalTitle"
  ).textContent =
    "افزودن محصول";

  productModal.classList.remove(
    "hidden"
  );

}


document.getElementById(
  "addButton"
).addEventListener(
  "click",
  openAddModal
);


window.editProduct =
  function(id){

    const product =
      products.find(
        function(item){
          return String(item.id) ===
            String(id);
        }
      );


    if(!product){
      return;
    }


    document.getElementById(
      "productId"
    ).value =
      product.id;


    document.getElementById(
      "productName"
    ).value =
      product.name || "";


    document.getElementById(
      "productPrice"
    ).value =
      product.price || "";


    document.getElementById(
      "productStock"
    ).value =
      product.stock || "";


    document.getElementById(
      "productCategory"
    ).value =
      product.category ||
      "اکسسوری";


    document.getElementById(
      "productSubcategory"
    ).value =
      product.subcategory || "";


    document.getElementById(
      "productImage"
    ).value =
      product.image_url || "";


    document.getElementById(
      "productDescription"
    ).value =
      product.description || "";


    document.getElementById(
      "modalTitle"
    ).textContent =
      "ویرایش محصول";


    formMessage.innerHTML = "";


    productModal.classList.remove(
      "hidden"
    );

  };


async function saveProduct(){

  const id =
    document.getElementById(
      "productId"
    ).value;


  const name =
    document.getElementById(
      "productName"
    ).value.trim();


  const price =
    Number(
      document.getElementById(
        "productPrice"
      ).value
    );


  const stock =
    Number(
      document.getElementById(
        "productStock"
      ).value
    );


  const category =
    document.getElementById(
      "productCategory"
    ).value;


  const subcategory =
    document.getElementById(
      "productSubcategory"
    ).value.trim();


  const image_url =
    document.getElementById(
      "productImage"
    ).value.trim();


  const description =
    document.getElementById(
      "productDescription"
    ).value.trim();


  if(!name){

    showFormMessage(
      "نام محصول را وارد کن."
    );

    return;

  }


  if(!Number.isFinite(price) || price < 0){

    showFormMessage(
      "قیمت صحیح نیست."
    );

    return;

  }


  if(!Number.isFinite(stock) || stock < 0){

    showFormMessage(
      "موجودی صحیح نیست."
    );

    return;

  }


  const saveButton =
    document.getElementById(
      "saveButton"
    );


  saveButton.disabled = true;

  saveButton.textContent =
    "در حال ذخیره...";


  const payload = {

    name:name,

    price:price,

    stock:stock,

    category:category,

    subcategory:
      subcategory || null,

    image_url:
      image_url || null,

    description:
      description || null

  };


  let result;


  if(id){

    result =
      await db
        .from("products")
        .update(payload)
        .eq("id",id);

  }else{

    result =
      await db
        .from("products")
        .insert(payload);

  }


  saveButton.disabled = false;

  saveButton.textContent =
    "ذخیره";


  if(result.error){

    showFormMessage(
      "خطا: " +
      result.error.message
    );

    return;

  }


  showFormMessage(
    "محصول با موفقیت ذخیره شد.",
    "success"
  );


  setTimeout(
    async function(){

      closeModal();

      await loadProducts();

    },
    500
  );

}


document.getElementById(
  "saveButton"
).addEventListener(
  "click",
  saveProduct
);


window.deleteProduct =
  async function(id){

    const product =
      products.find(
        function(item){
          return String(item.id) ===
            String(id);
        }
      );


    if(!product){
      return;
    }


    const confirmed =
      confirm(
        "آیا از حذف «" +
        product.name +
        "» مطمئنی؟"
      );


    if(!confirmed){
      return;
    }


    const result =
      await db
        .from("products")
        .delete()
        .eq("id",id);


    if(result.error){

      alert(
        "حذف انجام نشد:\n" +
        result.error.message
      );

      return;

    }


    await loadProducts();

  };
  function closeModal(){

  productModal.classList.add(
    "hidden"
  );

}


document.getElementById(
  "closeButton"
).addEventListener(
  "click",
  closeModal
);


document.getElementById(
  "cancelButton"
).addEventListener(
  "click",
  closeModal
);


productModal.addEventListener(
  "click",
  function(event){

    if(event.target === productModal){

      closeModal();

    }

  }
);


window.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Escape"){

      closeModal();

    }

  }
);


/*
   شروع برنامه
*/

checkSession();

</script>
